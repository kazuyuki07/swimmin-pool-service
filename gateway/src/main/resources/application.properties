spring.application.name=gateway
server.port=8080

# --- Маршрутизация: единая точка входа для клиента ---
# Java core-сервис (клиенты, абонементы, посещения)
spring.cloud.gateway.mvc.routes[0].id=swimmin-pool
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/clients/**,/api/v1/subscriptions/**,/api/v1/visits/**

# Rust reporting-сервис (отчёты)
spring.cloud.gateway.mvc.routes[1].id=reporting
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/reports/**

# Адреса бэкендов можно переопределить через env:
# POOL_URI=http://... REPORTING_URI=http://...
