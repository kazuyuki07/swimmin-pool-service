[package]
name = "reporting"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["tower-log"] }
sqlx = { version = "0.9.0", features = ["postgres", "macros", "chrono"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
