<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Клиенты</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="nav">
    <span class="logo">🏊 Бассейн</span>
    <a th:href="@{/}">Главная</a>
    <a th:href="@{/visits}">Посещения</a>
    <a th:href="@{/reports}">Отчёты</a>
</nav>
<main class="container">
    <h1>Клиенты</h1>

    <form id="clientForm" class="panel">
        <h2>Новый клиент</h2>
        <div class="grid">
            <input name="lastName" placeholder="Фамилия" required>
            <input name="firstName" placeholder="Имя" required>
            <input name="surname" placeholder="Отчество" required>
            <input name="phoneNumber" placeholder="Телефон" required>
            <input name="email" type="email" placeholder="Email" required>
            <input name="birthDate" type="date" required>
        </div>
        <button type="submit">Создать</button>
        <span id="clientMsg" class="msg"></span>
    </form>

    <div class="panel">
        <h2>Список</h2>
        <div class="filters">
            <input id="searchLastName" placeholder="Фильтр по фамилии">
            <button id="applyFilter">Применить</button>
        </div>
        <table id="clientsTable">
            <thead>
            <tr><th>Фамилия</th><th>Имя</th><th>Отчество</th><th>Телефон</th><th>Email</th><th>Дата рождения</th></tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="pager">
            <button id="prevPage">←</button>
            <span id="pageInfo"></span>
            <button id="nextPage">→</button>
        </div>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
    ClientsPage.init(/*[[${gatewayUrl}]]*/ 'http://localhost:8080');
</script>
</body>
</html>
