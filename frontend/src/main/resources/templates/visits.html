<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Посещения</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="nav">
    <span class="logo">🏊 Бассейн</span>
    <a th:href="@{/}">Главная</a>
    <a th:href="@{/clients}">Клиенты</a>
    <a th:href="@{/reports}">Отчёты</a>
</nav>
<main class="container">
    <h1>Посещения</h1>

    <form id="checkInForm" class="panel">
        <h2>Check-in</h2>
        <p class="hint">Контракт VisitDTO не содержит id клиента — заполняется по ФИО/телефону существующего клиента.</p>
        <div class="grid">
            <input name="lastName" placeholder="Фамилия" required>
            <input name="firstName" placeholder="Имя" required>
            <input name="surname" placeholder="Отчество" required>
            <input name="phoneNumber" placeholder="Телефон" required>
            <input name="email" type="email" placeholder="Email">
            <input name="birthDate" type="date">
        </div>
        <div class="grid">
            <select name="subscriptionType">
                <option>ONCE_ONLY</option><option>VISIT4</option><option>VISIT8</option>
                <option>VISIT12</option><option>NO_LIMIT</option>
            </select>
            <input name="expire" type="date" title="Действует до">
        </div>
        <button type="submit">Зарегистрировать вход</button>
        <span id="checkInMsg" class="msg"></span>
    </form>

    <div class="panel">
        <h2>Журнал</h2>
        <table id="visitsTable">
            <thead>
            <tr><th>Клиент</th><th>Абонемент</th><th>Вход</th><th>Выход</th><th></th></tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="pager">
            <button id="prevPage">←</button>
            <span id="pageInfo"></span>
            <button id="nextPage">→</button>
        </div>
    </div>
</main>
<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
    VisitsPage.init(/*[[${gatewayUrl}]]*/ 'http://localhost:8080');
</script>
</body>
</html>
